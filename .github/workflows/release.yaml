name: Create Release

on:
  push:
    tags:
    - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to rebuild and attach to the same release (e.g. 0.2.8)"
        required: true
        type: string

env:
  # Tag push: ref is refs/tags/… Manual run: use the input tag.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install conventional-changelog-cli
      run: npm install -g conventional-changelog-cli

    - name: Generate changelogs
      run: |
        conventional-changelog -p angular -o CHANGELOG.md -r 0
        conventional-changelog -p angular -o RELEASE_NOTES.md -r 1

    - name: Create Release Archive
      run: |
        mkdir -p blender-asset-exporter
        cp CHANGELOG.md COPYING README.md blender_manifest.toml *.py blender-asset-exporter/
        zip -r "blender-asset-exporter-${{ env.RELEASE_TAG }}.zip" blender-asset-exporter
        rm -rf blender-asset-exporter

    - name: Upload Release
      uses: ncipollo/release-action@v1.12.0
      with:
        artifacts: "blender-asset-exporter-${{ env.RELEASE_TAG }}.zip"
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ env.RELEASE_TAG }}
        name: ${{ env.RELEASE_TAG }}
        bodyFile: RELEASE_NOTES.md
        # Re-run the workflow for the same tag without a version bump
        allowUpdates: true
        # GitHub otherwise picks "Latest" by semver heuristics; without a clear winner the UI may not show a latest link.
        makeLatest: true
